name: Launch certification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: launch-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run launch certification
        run: npm run launch:certify

      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-certification-${{ github.sha }}
          path: .stage31/launch-audit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
